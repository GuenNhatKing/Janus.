[project]
name = "pbl6-ai-short-video-moderation"
version = "0.1.0"
description = "PBL6 short-video moderation platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "email-validator>=2.2,<3",
    "fastapi[standard]>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "black>=24,<26",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

# Cài editable gói `app` từ src/ để `uv run uvicorn app.main:app`,
# `uv run python -m scripts.check_db` và `uv run alembic` đều import được
# mà không cần khai báo PYTHONPATH hay --app-dir.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# Cấu hình kiểm thử cho layout src/: đặt backend/src vào sys.path để `import app...` hoạt động.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
